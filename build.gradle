plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	mavenLocal()
	maven { url 'https://maven.isxander.dev/releases' }
	maven { url "https://maven.terraformersmc.com/releases/" }
	maven { url "https://maven.shedaniel.me/" }
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		url "https://www.cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
	maven {url 'https://maven.azuredoom.com/mods'}
	maven { url = 'https://maven.kosmx.dev/' }
	maven { url = 'https://jitpack.io' }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Simply Skills
	modImplementation "maven.modrinth:lyvwxqAy:${project.simply_skills_id}"
	// Cloth Config
	modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// S-Lib
	modImplementation "com.stalemated.lib:s-lib-fabric:${project.s_lib_version}"

	// YACL
	modImplementation "dev.isxander:yet-another-config-lib:${project.yacl_version}-fabric"
	// ModMenu
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Puffish Skills + Attributes
	modRuntimeOnly "curse.maven:puffish-skills-835091:${project.puffish_skills_version}"
	modRuntimeOnly "curse.maven:puffish-attributes-991341:${project.puffish_attributes_version}"

	// Spell Power + Spell Engine + Player Animator + Tiny Config
	modImplementation "maven.modrinth:spell-power:${project.spell_power_version}-fabric"
	modImplementation "maven.modrinth:spell-engine:${project.spell_engine_version}-fabric"
	modRuntimeOnly "dev.kosmx.player-anim:player-animation-lib-fabric:${project.player_anim_version}"
	implementation include("com.github.ZsoltMolnarrr:TinyConfig:${project.tiny_config_version}")

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
